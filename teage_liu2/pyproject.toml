[project]
name = "teage-liu2"
version = "0.1.0"
description = "主干-枝干架构的个人 AI Agent(teage_liu2 重构版,M1 纯对话内核)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "teage_liu2",
    "teage_liu2.core",
    "teage_liu2.server",
]

# 非 .py 运行时资产必须显式声明,否则 `pip install` 后不会随包发布:
# - PROTOCOL/config/config.schema.json —— 配置结构校验的**运行时唯一源**
#   (`core/config.py::load_config_schema` 在启动路径无条件加载;缺失 = fail-closed 启动失败,
#   装包部署会"安装即坏",2026-09-18 审查发现并修复)。
# - web/** —— `/ui` 静态前端(`server/app.py` 挂载;缺失时该挂载被跳过,属静默降级)。
[tool.setuptools.package-data]
teage_liu2 = ["PROTOCOL/config/*.json", "web/**/*"]
